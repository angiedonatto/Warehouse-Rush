id: j3
hipotesis: >
  e4 con ent_coef 0.01 (solo cambia el bloque ppo; recompensa identica a m1-e4l). 600 000 pasos, semilla 0, mapa con muro.
  Hipotesis: las politicas colapsan a una accion casi determinista (idle, giros, DESCARGAR) antes de descubrir la cadena; un bono de entropia moderado mantiene la exploracion. En v1 (n1-c1) 0.01 no ayudo, pero con una recompensa de progreso y mas pasos no se ha probado.
  Se refuta si el exito en suite-m1-v1 es < 5% o si los choques por episodio suben > 10% frente a m1-e4l-seed0.
nivel: m1
environment_version: warehouse-v8
parent_run_id: null
seed: 0
presupuesto_pasos: 600000
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
  manhattan_progress: 0.3
  height_mismatch: -0.02
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
