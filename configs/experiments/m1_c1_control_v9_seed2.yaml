id: c1
hipotesis: >
  Control de regresion de warehouse-v9: la recompensa de m1-c0l (invalid -0.2, collision -1, progress 0.3 por defecto, sin potencial ni terminos de shaping) con el codigo v9 y la parada de estancamiento de 100 pasos. 600 000 pasos, mapa con muro, semillas 0-2 (como m1-c0l).
  Pregunta: ¿la linea base sigue llegando al estante con el codigo v9 y la parada? m1-c0l llego a la celda de interaccion en 29/50, 0/50 y 50/50 episodios (semillas 0, 1, 2). Si lo reproduce, los 0/10 de los runs con potencial son del potencial; si da 0/3, el cambio de codigo o la parada rompen la linea base.
  Control descriptivo, sin adopcion: se compara el patron con m1-c0l.
nivel: m1
environment_version: warehouse-v9
parent_run_id: null
seed: 2
presupuesto_pasos: 600000
parada_estancamiento: 100   # solo entrenamiento (v9)
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
