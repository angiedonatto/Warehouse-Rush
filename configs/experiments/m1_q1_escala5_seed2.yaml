id: q1
hipotesis: >
  m1-p1 con la recompensa de la tarea y el potencial multiplicados por 5 (pickup 50, delivery 150, completion 250, potential 150; penalizaciones, time y battery sin cambio). Sin cambio de codigo (warehouse-v9). Parada por estancamiento de 100 pasos como en p1. 600 000 pasos, mapa con muro, semillas 0-2.
  Motivo: con W = 30 el shaping de navegacion valia 0.08 por celda (e4: 0.6) y las 4 politicas de p1/p2 colapsaron a FRENAR. Con factor 5 vale 0.40 por celda.
  Hipotesis: con el shaping de navegacion por encima del coste de moverse la politica se acerca al estante y el resto de etapas del potencial (mirar, subir, cargar, bajar, entregar) se descubre, y mas semillas despegan.
  Como SB3 normaliza ventajas, escalar solo los terminos positivos equivale a dividir por 5 las penalizaciones (colision efectiva -0.2, invalida -0.04, tiempo -0.02): riesgo de la trampa de choques vista con colision -0.5/-0.1 (m1-r6/r7).
  Se refuta si el exito medio de las 3 semillas en suite-m1-v1 es < 5% o si los choques por episodio suben > 10% frente a m1-e4l (0).
nivel: m1
environment_version: warehouse-v9
parent_run_id: null
seed: 2
presupuesto_pasos: 600000
parada_estancamiento: 100   # solo entrenamiento: trunca tras 100 pasos sin superar el mejor potencial; la evaluación usa 400 pasos
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
  progress: 0.0
  pickup: 50.0
  delivery: 150.0
  completion: 250.0
  potential: 150.0
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
