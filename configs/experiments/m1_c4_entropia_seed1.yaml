id: c4
hipotesis: >
  Receta de m1-c3 (invalid -0.2, collision -1, progress 0.3 por defecto, parada 100, 1 800 000 pasos, mapa con muro, warehouse-v10) con ent_coef 0.01 en lugar de 0.0. Solo cambia ent_coef; semillas 1-4, las cuatro en que m1-c3 dio 0% (seed0 dio 98%).
  Motivo: a 1.8M pasos el RL puro completa la mision en 3 de 11 semillas; las demas se estancan en una etapa (idle, mirar, cargar sin entregar) y PPO con ent_coef 0 no sale de ahi. j3 probo ent_coef 0.01 solo a 600 000 pasos, donde ninguna receta funciona.
  Hipotesis: el bono de entropia mantiene la exploracion lo bastante para que mas semillas descubran la cadena completa dentro del presupuesto.
  Criterio (fijado antes): muestra senal si >= 2 de las 4 semillas alcanzan >= 50% de exito en suite-m1-v1 con choques <= 0.1 por episodio (m1-c3 en esas semillas: 0 de 4). Se refuta si 0 de 4; 1 de 4 es inconcluyente (tasa base ≈ 27%).
nivel: m1
environment_version: warehouse-v10
parent_run_id: null
seed: 1
presupuesto_pasos: 1800000
parada_estancamiento: 100   # solo entrenamiento (v9)
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
