id: r3
hipotesis: >
  Bajar la penalización por interacción inválida de -2 a -0.05 aumenta el éxito frente al control; casi no castiga explorar acciones inválidas pero sigue siendo negativa (no es rentable repetirlas).
  Único cambio frente a m1-c0 (v2): invalid_interaction = -0.05. Modelo, hiperparámetros, presupuesto y ambiente (3 productos aleatorios) iguales.
  La hipótesis se refuta si el éxito en suite-m1-v1 no supera al control en >= 5 pp.
nivel: m1
environment_version: warehouse-v3
parent_run_id: null
seed: 0
presupuesto_pasos: 200000
recompensa:
  invalid_interaction: -0.05   # único cambio; las demás recompensas son las del mapa (= v2)
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
