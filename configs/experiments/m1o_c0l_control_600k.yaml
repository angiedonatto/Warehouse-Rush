  Control con el mismo presupuesto que e4l (600 000 pasos): recompensa base (invalid -0.2, collision -1) sin términos v4/v5, mapa abierto, semilla 0.
  Aísla el efecto de los pasos extra frente al de la recompensa de e4l.
nivel: m1o
environment_version: warehouse-v5
