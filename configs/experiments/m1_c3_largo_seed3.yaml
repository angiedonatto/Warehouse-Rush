id: c3
hipotesis: >
  Repeticion de m1-c3-seed0 (98% de exito: receta base invalid -0.2, collision -1, progress 0.3 por defecto, parada de estancamiento 100, 1 800 000 pasos, mapa con muro, warehouse-v10) en las semillas nuevas 1, 2, 3 y 4. Solo cambia la semilla.
  Pregunta: ¿cuan fiable es la receta base? m1-e4x y m1-e4y solo despegaron en 1 de 3 semillas; m1-c3 tiene una sola semilla (0).
  Hipotesis: la receta base con 1 800 000 pasos y parada completa la mision en la mayoria de las semillas.
  Criterio (fijado antes): la receta es candidata a finalista si al menos 3 de las 5 semillas (0-4, contando m1-c3-seed0) alcanzan >= 50% de exito en suite-m1-v1 con 0 choques por episodio (choques sin subir > 10% frente a m1-e4l). Se refuta si como maximo 1 de las 4 semillas nuevas alcanza >= 50%.
nivel: m1
environment_version: warehouse-v10
parent_run_id: null
seed: 3
presupuesto_pasos: 1800000
parada_estancamiento: 100   # solo entrenamiento (v9)
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
