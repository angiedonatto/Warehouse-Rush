id: c2
hipotesis: >
  Reproduccion exacta de m1-c0l-seed0 con el codigo warehouse-v9 y SIN parada de estancamiento (solo cambia la version del ambiente). El entrenamiento es determinista: si el codigo v9 no cambia la dinamica ni la recompensa con potential = 0, los pesos deben ser identicos a los de m1-c0l-seed0 (misma semilla y config).
  Separa el efecto del codigo v9 del de la parada: junto con m1-c1 dice cual de los dos, si alguno, cambia la linea base.
nivel: m1
environment_version: warehouse-v9
parent_run_id: null
seed: 0
presupuesto_pasos: 600000
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
