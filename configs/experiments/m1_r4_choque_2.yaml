id: r4
hipotesis: >
  Con invalid_interaction fijo en -0.2, bajar la penalización por choque de -5 a -2.0 aumenta el éxito frente a m1-r2 (choque -5).
  Cuentas previas con los conteos de la política aleatoria de m1-c0 (15.3 choques, 199.6 inválidas, 400 pasos): retorno aleatorio de ~-160 (r2) a ~-113.
  Sigue por debajo de quedarse quieto (~-41) porque las inválidas aportan ~-40, así que el costo de explorar no desaparece.
  Único cambio frente a m1-r2: collision = -2.0. Modelo, hiperparámetros, presupuesto y ambiente (3 productos aleatorios) iguales.
  Se refuta si el éxito en suite-m1-v1 no supera al de m1-r2 en >= 5 pp.
nivel: m1
environment_version: warehouse-v3
parent_run_id: null
seed: 0
presupuesto_pasos: 200000
recompensa:
  invalid_interaction: -0.2   # fijo en todo el barrido (igual que m1-r2)
  collision: -2.0             # única dimensión que cambia
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
