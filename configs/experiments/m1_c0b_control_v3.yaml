id: c0b
hipotesis: >
  Control en warehouse-v3 con la recompensa por defecto (idéntica a v2). Repite m1-c0 bajo el código v3 para que la comparación no dependa de otra versión del ambiente.
  Único cambio frente a m1-c0 (v2): ninguno (control). Modelo, hiperparámetros, presupuesto y ambiente (3 productos aleatorios) iguales.
  La hipótesis se refuta si el éxito en suite-m1-v1 no supera al control en >= 5 pp.
