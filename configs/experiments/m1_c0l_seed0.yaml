id: c0l
hipotesis: >
  Control del mismo presupuesto que m1-e4l (600 000 pasos) en el mapa con muro layout_v0.4: recompensa base (invalid -0.2, collision -1) sin manhattan_progress ni height_mismatch. Semillas 0, 1 y 2.
  Aísla el efecto de la recompensa de e4 frente al de los pasos. Es un control descriptivo: no se adopta ni se rechaza; se compara con m1-e4l (0% de media) y con m1-r5 (200 000 pasos, 0%).
nivel: m1
environment_version: warehouse-v7
parent_run_id: null
seed: 0
presupuesto_pasos: 600000
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
