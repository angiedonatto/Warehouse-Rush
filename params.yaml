# Versioned by DVC: changing any value here invalidates the `train` stage.
env:
  size: 8
  n_obstacles: 10
train:
  seed: 0
  max_episodes: 60000
  alpha: 0.2
  gamma: 0.97
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_fraction: 0.4   # fraction of max_episodes over which epsilon decays
early_stopping:
  eval_every: 500           # episodes between greedy evaluations
  eval_layouts: 200         # fixed random layouts used for each evaluation
  patience: 10              # evaluations without improvement before stopping
  min_delta: 0.005          # smallest score gain that counts as improvement
  min_episodes: 30000       # never stop before this many episodes
