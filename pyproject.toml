[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-rush"
version = "0.1.0"
description = "Entorno discreto de recogida y entrega para aprendizaje por refuerzo"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "gymnasium==1.0.0",
  "torch==2.2.2; sys_platform != 'linux'",
  "torch==2.2.2+cpu; sys_platform == 'linux'",
  "stable-baselines3==2.4.1",
  "matplotlib==3.9.4",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
warehouse-rush = "warehouse_rush.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warehouse_rush = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
