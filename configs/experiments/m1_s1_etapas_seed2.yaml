id: s1
hipotesis: >
  m1-c1 (receta de m1-c0l: invalid -0.2, collision -1, progress 0.3, parada 100) mas las etapas del potencial SIN la parte de navegacion (warehouse-v10: potential 30.0, potential_nav 0.0). progress 0.3, que llega al estante en 2 de 3 semillas, queda intacto y es la unica senal de navegacion; el potencial solo aporta: bandeja guardada al viajar, llegar y mirar la estacion, altura de la bandeja, y el avance K por recoger/entregar (renormalizado: stow 1/6, mirar 1/3, altura 1/2).
  Motivo: los 10 runs con potencial completo (navegacion incluida) no llegaron nunca a la celda; el control m1-c1 mostro que el fallo es del potencial y no del codigo v9 ni de la parada. Este experimento aisla si el problema es la parte de navegacion del potencial.
  Hipotesis: con la navegacion de progress y las etapas del potencial encima, las semillas que llegan al estante pasan a subir la bandeja, cargar, bajarla y entregar (m1-c1-seed0 llegaba 49/50, subia 41/50, cargaba 19/50 y nunca entregaba), y no se pierde el llegar al estante.
  Se refuta si el exito medio de las 3 semillas en suite-m1-v1 es < 5% o si los episodios que llegan a la celda caen frente a m1-c1 (49/0/21 de 50 en las semillas 0/1/2).
