id: e4l
hipotesis: >
  Replica en las semillas 3-7 (no vistas) de e4l: Manhattan 0.3, altura -0.02, collision -1, invalid -0.2, time -0.1, mapa abierto, 600 000 pasos. Corre con warehouse-v7 y carry_milestone en 0, que equivale a v5
  (prueba test_v7_with_milestone_off_matches_v5_returns y e4l-seed1 identico a g1-seed1). Es el control de m1o-g1 en esas semillas; estima cuantas semillas funcionan con la recompensa e4l.
  Criterio de la comparacion con g1 (fijado antes): docs/experimentos.md, seccion 'Mas semillas de e4l y g1'.
nivel: m1o
environment_version: warehouse-v7
parent_run_id: null
seed: 5
presupuesto_pasos: 600000
layout: configs/layout_v0.5.json   # mapa abierto
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
  manhattan_progress: 0.3
  height_mismatch: -0.02
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1o-v1
  cada_pasos: 20000
  final: suite-m1o-v1
