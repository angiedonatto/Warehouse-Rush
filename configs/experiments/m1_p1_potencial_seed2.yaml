id: p1
hipotesis: >
  Shaping solo por potencial (warehouse-v9): se quitan manhattan_progress, height_mismatch, face_bonus, carry_milestone y progress (0) y se deja un unico termino potential 30.0 = W*(0.99*Phi(s') - Phi(s)), con Phi por etapas en [0,1]. Mas parada por estancamiento en el entrenamiento (100 pasos sin superar el mejor Phi). 600 000 pasos, mapa con muro, semillas 0-2.
  Hipotesis: un unico potencial por etapas (navegar, mirar, subir la bandeja, cargar, bajarla, llegar al despacho) da senal para la cadena completa sin las zonas de evitacion de los terminos sueltos, y mas episodios por paso gracias a la parada hacen que mas semillas despeguen.
  Se refuta si el exito medio de las 3 semillas en suite-m1-v1 es < 5% o si los choques por episodio suben > 10% frente a m1-e4l.
nivel: m1
environment_version: warehouse-v9
parent_run_id: null
seed: 2
presupuesto_pasos: 600000
parada_estancamiento: 100   # solo entrenamiento: trunca tras 100 pasos sin superar el mejor potencial; la evaluación usa 400 pasos
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
  progress: 0.0
  potential: 30.0
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
