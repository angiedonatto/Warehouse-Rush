id: c5
hipotesis: >
  Continuacion de m1-c4-seed2 desde su checkpoint final (parent_run_id) con 1 800 000 pasos mas y la misma
  receta (invalid -0.2, collision -1, progress 0.3 por defecto, ent_coef 0.01, parada 100, mapa con muro,
  warehouse-v10). Nada cambia salvo el punto de partida: el modelo ya carga las 3 lineas en 50/50 episodios
  con 0 invalidas y 0 choques y nunca entrega; su retorno en la evaluacion intermedia se volvio positivo a
  1 460 000 pasos, al final del presupuesto.
  Hipotesis: el tramo de entrega es cuestion de presupuesto, no de senal: con mas pasos la politica que ya
  carga aprende a llevar la carga al despacho.
  Criterio (fijado antes): se cumple si m1-c5-seed2 alcanza >= 50% de exito en suite-m1-v1 con choques
  <= 0.1 por episodio. Se refuta si < 50%; si ademas sigue con 0 entregas por episodio, el presupuesto solo
  no resuelve el tramo de entrega y la siguiente palanca es una senal en ese tramo (v11).
nivel: m1
environment_version: warehouse-v10
parent_run_id: m1-c4-seed2
seed: 2
presupuesto_pasos: 1800000
parada_estancamiento: 100   # solo entrenamiento (v9)
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
