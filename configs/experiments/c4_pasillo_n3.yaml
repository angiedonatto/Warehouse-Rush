id: c4
hipotesis: >
  Reentrenar el modelo de N2 con el pasillo cerrado aleatorio recupera el éxito perdido por el incidente sin olvidar N2.
nivel: n3
environment_version: warehouse-v1
parent_run_id: <run_id del modelo recomendado de N2>
seed: 0
presupuesto_pasos: 300000
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-n3-v1
  cada_pasos: 50000
  final: suite-n3-v1
