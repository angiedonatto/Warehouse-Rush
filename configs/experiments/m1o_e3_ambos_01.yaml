id: e3
hipotesis: >
  La distancia Manhattan como DIFERENCIA (sin el salto de penalización al cambiar de objetivo del término por estado de d1-d3) y una penalización por
  altura de bandeja distinta cuando el robot está en la celda de interacción del objetivo mejoran el éxito frente al control del mismo mapa (m1o-c0).
  Este run prueba: ambos términos (diferencia Manhattan 0.3 y altura -0.1).
  Se refuta si el éxito en suite-m1o-v1 no supera al de m1o-c0 en >= 5 pp.
nivel: m1o
environment_version: warehouse-v5
parent_run_id: null
seed: 0
presupuesto_pasos: 200000
layout: configs/layout_v0.5.json   # mapa abierto
recompensa:
  invalid_interaction: -0.2   # fijo
  collision: -1.0             # fijo en -1
  manhattan_progress: 0.3   # v5: recompensa por reducir la distancia Manhattan al objetivo (resta si se aleja)
  height_mismatch: -0.1     # v5: penalización por paso y por puesto de bandeja de diferencia, solo en una celda de interacción del objetivo
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1o-v1
  cada_pasos: 20000
  final: suite-m1o-v1
