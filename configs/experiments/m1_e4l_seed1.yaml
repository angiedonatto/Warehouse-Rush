id: e4l
hipotesis: >
  La recompensa de e4 (diferencia Manhattan 0.3, altura -0.02, collision -1, invalid -0.2) con 600 000 pasos, que en el mapa abierto llevó a una semilla de tres a 92%, también permite completar el pedido en el mapa con muro interior (layout_v0.4, nivel m1) y supera a la referencia m1-r5 (misma recompensa de choque/inválida, 200 000 pasos, 0%).
  Cambia solo el mapa (y el nivel) frente a m1o-e4l; semillas 0, 1 y 2. Se refuta si el éxito medio de las 3 semillas en suite-m1-v1 no supera en >= 5 pp al de m1-r5 (0%).
nivel: m1
environment_version: warehouse-v7
parent_run_id: null
seed: 1
presupuesto_pasos: 600000
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
  manhattan_progress: 0.3
  height_mismatch: -0.02
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
