id: e4y
hipotesis: >
  Repeticion de m1-e4x (recompensa e4: manhattan_progress 0.3, height_mismatch -0.02, invalid -0.2, collision -1, progress 0.3 por defecto; 1 800 000 pasos, mapa con muro) con la parada de estancamiento de 100 pasos y las semillas nuevas 3, 4 y 5. Codigo warehouse-v10 (potential en 0).
  Pregunta: ¿cuan fiable es el exito de m1-e4x (80% en la semilla 2, 0% en las semillas 0 y 1)? e4x corrio SIN parada; aqui la parada da ≈ 3.7 veces mas episodios por paso.
  Hipotesis: con 1 800 000 pasos y la parada, al menos una de las 3 semillas nuevas completa la mision.
  Se refuta si el exito medio de las 3 semillas en suite-m1-v1 es < 5% o si los choques por episodio suben > 10% frente a m1-e4l (0).
nivel: m1
environment_version: warehouse-v10
parent_run_id: null
seed: 5
presupuesto_pasos: 1800000
parada_estancamiento: 100   # solo entrenamiento
layout: configs/layout_v0.4.json   # mapa con muro interior (paso permanente x=20, paso cerrable x=6)
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
  manhattan_progress: 0.3
  height_mismatch: -0.02
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1-v1
  cada_pasos: 20000
  final: suite-m1-v1
