id: e4x
hipotesis: >
  e4 (manhattan_progress 0.3, height_mismatch -0.02, collision -1, invalid -0.2) en el mapa con muro con 3 veces el presupuesto de m1-e4l (1 800 000 pasos). Semillas 0, 1 y 2.
  Hipótesis: en el mapa abierto la primera victoria llegó hacia los 340 000 pasos y el aprendizaje se consolidó a 500 000; con el muro el descubrimiento es más lento y 600 000 pasos no bastaron. Con 1 800 000 pasos la política completa la cadena. Cambia solo el presupuesto frente a m1-e4l.
  Se refuta si el éxito medio de las 3 semillas en suite-m1-v1 no supera en >= 5 pp al de m1-e4l (0%).
