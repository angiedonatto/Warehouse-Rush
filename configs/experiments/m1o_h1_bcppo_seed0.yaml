id: h1
hipotesis: >
  Ajuste fino con PPO desde el modelo de clonacion de comportamiento h0 de la misma semilla (parent_run_id), con la recompensa y el PPO de e4l y 600 000 pasos.
  Cambia solo la inicializacion frente a e4l. Hipotesis: arrancar desde la imitacion da una politica que ya carga y entrega en las semillas en que e4l no descubre la tarea (1 y 2),
  y el ajuste fino la mantiene o mejora. Se refuta si el exito medio de las 3 semillas no supera al de e4l (30.7%) en >= 5 pp o si los choques suben > 0.1 por episodio.
nivel: m1o
environment_version: warehouse-v7
parent_run_id: m1o-h0-seed0
seed: 0
presupuesto_pasos: 600000
layout: configs/layout_v0.5.json   # mapa abierto
recompensa:
  invalid_interaction: -0.2
  collision: -1.0
  manhattan_progress: 0.3
  height_mismatch: -0.02
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  n_envs: 4
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
evaluacion:
  intermedia: dev-m1o-v1
  cada_pasos: 20000
  final: suite-m1o-v1
